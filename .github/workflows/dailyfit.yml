name: Update DailyFit records

on:
  schedule:
    - cron: "30 18 * * *"  # 00:00 IST
  workflow_dispatch:

jobs:
  create-daily-records:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install firebase-admin google-cloud-firestore google-api-core

      - name: Update Firestore records
        env:
          FIREBASE_CREDENTIALS: ${{ secrets.FIREBASE_CREDENTIALS }}
          DRY_RUN: "false"
          MAX_USERS: "10000"
        run: python functions/daily_create.py